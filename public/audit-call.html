<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Контакт для выезда</title>
  <link rel="stylesheet" href="/audit-call.css">
  <script src="/audit-actions.js" defer></script>
  <script src="/audit-call.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Контакт для выезда</p>
    <h1>Позвонить</h1>
    <input id="phone" aria-label="Телефон" type="tel" readonly hidden>
    <a id="dial" class="primary" hidden>Набрать номер</a>
    <button id="copy" type="button" hidden>Скопировать номер</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="hint">После звонка вернитесь в Telegram — отчёт остаётся в боте.</p>
  </main>
</body>
</html>
